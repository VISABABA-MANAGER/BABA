
{% extends "base.html" %}{% block content %}<h1>Utilisateurs</h1><div class="panel"><form method="post" class="grid">
<input name="full_name" placeholder="Nom complet" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Mot de passe" required>
<select name="role"><option value="employee">Employé</option><option value="admin">Administrateur</option></select><button>Créer</button></form></div>
<div class="panel"><table><tr><th>Nom</th><th>Email</th><th>Rôle</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.email}}</td><td>{{u.role}}</td></tr>{% endfor %}</table></div>{% endblock %}
